# 仅部署Web Service；数据库使用外部Neon。禁止增加Render数据库资源。
services:
  - type: web
    name: shushang-taoxiang-digital-media
    runtime: node
    branch: deploy/render-neon
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SINGLE_ADMIN_ACCOUNT
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: 项目管理员
